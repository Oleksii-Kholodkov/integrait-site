name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate: Build
      - name: Build
        run: npm run build

      # Gate: Link/HTML validation
      - name: Validate HTML and links
        run: npx html-validate 'dist/**/*.html'

      # Gate: Accessibility
      - name: Accessibility scan
        run: npx pa11y --standard WCAG2AA -c pa11y.json dist/index.html

      # Gate: Security
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      # Gate: Traceability (PR only — a push to main is already-merged history)
      - name: Check traceability artifact
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if ! echo "$changed" | grep -q '^work/.*/traceability.md$'; then
            echo "No work/<id>/traceability.md changed or added in this PR." >&2
            exit 1
          fi
